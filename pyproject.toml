[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civitas-research"
version = "0.2.0"
description = "Deterministic, inspectable substrate for compositional invention research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
play = ["pygame>=2.6,<3"]

[tool.setuptools.packages.find]
include = ["civitas*", "benchmarks*"]

[tool.setuptools.package-data]
benchmarks = ["*.json"]
"benchmarks.composition" = ["*.json"]
